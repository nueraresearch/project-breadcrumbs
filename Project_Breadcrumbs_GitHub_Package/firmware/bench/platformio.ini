; Bench harness build — separate from the device firmware on purpose.
; The bench sketch is a measurement tool, not flight code, and should never
; be flashed to a deployed module.

[env:bench]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
