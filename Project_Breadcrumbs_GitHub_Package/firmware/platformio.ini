; Project Breadcrumbs — monitoring module firmware
; ESP32-S3, OV2640, VEML7700, LIS3DH, BG95-M3
;
; Not compiled in this repository. See README.md §2.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Production image has no console (HW-30). Build with -DBREADCRUMBS_DEBUG
    ; locally to get serial output; never ship that build.

lib_deps =
    adafruit/Adafruit VEML7700 Library@^1.1.0
    adafruit/Adafruit LIS3DH@^1.2.3
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit Unified Sensor@^1.1.14
    https://github.com/espressif/esp32-camera.git#v2.0.4

[env:esp32s3_debug]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DBREADCRUMBS_DEBUG=1
    -DCORE_DEBUG_LEVEL=3
